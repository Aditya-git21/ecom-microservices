services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check, so it only passes after init scripts finish
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    env_file: ./user-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/users_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./product-service
    env_file: ./product-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/products_db
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./order-service
    env_file: ./order-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders_db
      PRODUCT_SERVICE_URL: http://product-service:8001
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

volumes:
  pgdata:
